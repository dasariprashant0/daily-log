name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: bash app/build.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mv app/DailyLog.zip "app/DailyLog-${TAG}.zip"
          gh release create "$TAG" "app/DailyLog-${TAG}.zip" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
