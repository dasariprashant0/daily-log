name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: bash tests/run-tests.sh
      - name: Build
        run: bash app/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DailyLog
          path: app/DailyLog.zip
